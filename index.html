<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertitore kWh a m³</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 40px; 
            background: #f4f4f9; 
            color: #333; 
        }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            max-width: 400px; 
            margin: auto; 
        }
        h2 { text-align: center; color: #007bff; margin-top: 0; }
        label { font-weight: bold; font-size: 0.9em; display: block; margin-top: 15px; }
        input, button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 5px; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 16px; 
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }
        
        /* Stile specifico per il pulsante Azzera */
        .btn-reset { 
            background: #6c757d; 
            margin-top: 8px;
        }
        .btn-reset:hover { background: #5a6268; }

        #risultato { 
            margin-top: 20px; 
            font-size: 1.2em; 
            font-weight: bold; 
            color: #28a745; 
            text-align: center;
            background: #e9f7ef;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Convertitore kWh ➔ m³</h2>
        
        <label for="kwh">Energia in kWh:</label>
        <input type="number" id="kwh" placeholder="es. 100" step="any">
        
        <label for="pcs">Fattore PCS (kWh/m³):</label>
        <input type="number" id="pcs" value="10.7" step="0.1">
        
        <button onclick="converti()">Calcola</button>
        <button class="btn-reset" onclick="azzera()">Azzera</button>
        
        <div id="risultato">Risultato: -</div>
    </div>

    <script>
        function converti() {
            let kwh = parseFloat(document.getElementById('kwh').value);
            let pcs = parseFloat(document.getElementById('pcs').value);
            
            if (isNaN(kwh) || isNaN(pcs) || pcs <= 0) {
                let res = document.getElementById('risultato');
                res.style.color = "#dc3545";
                res.style.background = "#f8d7da";
                res.innerText = "Inserisci valori validi!";
                return;
            }
            
            let m3 = kwh / pcs;
            let res = document.getElementById('risultato');
            res.style.color = "#28a745";
            res.style.background = "#e9f7ef";
            res.innerText = "Risultato: " + m3.toFixed(2) + " m³";
        }

        function azzera() {
            // Pulisce il campo kWh
            document.getElementById('kwh').value = '';
            
            // Ripristina il valore standard nel PCS (10.7)
            document.getElementById('pcs').value = '10.7';
            
            // Ripristina il box del risultato allo stato iniziale
            let res = document.getElementById('risultato');
            res.style.color = "#28a745";
            res.style.background = "#e9f7ef";
            res.innerText = "Risultato: -";
        }
    </script>

</body>
</html>
